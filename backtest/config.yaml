# All parameters live here; no magic numbers in code.
# Instrument is a config choice: python main.py --instrument UPRO

data:
  cache_dir: data_cache
  max_age_days: 7            # re-download when the cached parquet is older than this
  fetcher: yfinance          # registered fetcher: yfinance | csv
  csv_dir: null              # fetcher=csv -> <csv_dir>/<TICKER>.csv with Date,Close columns
  start: null                # null = max history
  end_date: null             # END_DATE: open episodes are closed here
  signal_index: ^NDX         # index used for drawdown / episode detection / MA
  vix_ticker: ^VIX
  rf_ticker: ^IRX            # 13-week T-bill yield (percent)
  rf_default: 0.02           # annual rf where rf_ticker has no data
  optional_tickers: [FNGU]   # fetched if available, never fatal

# Instrument registry. Any ticker not listed is used as-is (real prices only).
# `underlying` + `leverage` => synthetic history from the underlying, spliced to the real fund.
instruments:
  TQQQ: {underlying: ^NDX,  leverage: 3, expense_ratio: 0.0095}
  FNGU: {underlying: ^NDX,  leverage: 3, expense_ratio: 0.0095}   # proxy: no FANG+ history pre-launch
  UPRO: {underlying: ^GSPC, leverage: 3, expense_ratio: 0.0091}
  SSO:  {underlying: ^GSPC, leverage: 2, expense_ratio: 0.0089}
  QQQ:  {}

synthetic:
  financing_spread: 0.0      # added to rf when costing leverage: (L-1)*(rf+spread)/252
  trading_days: 252

run:
  instrument: TQQQ
  comparison_instruments: [QQQ]   # same strategy on 1x
  initial_capital: 10000

episodes:
  crash_threshold: 0.25      # CRASH_THRESHOLD
  merge_gap_days: 60         # MERGE_GAP_DAYS (calendar days between recovery and next start)
  override: []               # e.g. [{start: 2000-03-10, end: 2003-01-01}]; empty = auto-detect

strategy:
  stable_days: 63            # STABLE_DAYS: trading days with no new low
  buy_weeks: 8               # BUY_WEEKS: equal tranches, one per week
  tranche_step_days: 5
  hold_years: 2              # HOLD_YEARS after the first tranche (grid tests 2 and 3)
  chained: true              # proceeds redeployed at next qualifying episode
  execution_lag: 1           # decided at close t, filled at close t+lag
  cash_earns_rf: true        # false = cash earns 0
  cost_bps: 0.0              # slippage per fill; taxes are not modelled
  filters:                   # registered in signals.py; add more there or via registry
    vix_max:   {enabled: true,  max: 30}
    above_ma:  {enabled: false, window: 200}
    min_depth: {enabled: true,  min_depth: 0.15}

sensitivity:
  enabled: true
  grid:                      # dotted keys reach into nested params
    crash_threshold: [0.20, 0.25, 0.30]
    stable_days: [42, 63, 84]
    hold_years: [2, 3]
    filters.vix_max.max: [25, 30, 40]

output_dir: outputs
